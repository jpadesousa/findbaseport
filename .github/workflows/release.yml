name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
            extension: ""

          - goos: linux
            goarch: arm64
            name: linux-arm64
            extension: ""

          - goos: darwin
            goarch: amd64
            name: macos-amd64
            extension: ""

          - goos: darwin
            goarch: arm64
            name: macos-arm64
            extension: ""

          - goos: windows
            goarch: amd64
            name: windows-amd64
            extension: ".exe"

          - goos: windows
            goarch: arm64
            name: windows-arm64
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -o "dist/findbaseport-${{ matrix.name }}${{ matrix.extension }}" \
            .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: findbaseport-${{ matrix.name }}
          path: dist/findbaseport-${{ matrix.name }}${{ matrix.extension }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: findbaseport-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/findbaseport-*
            dist/checksums.txt
